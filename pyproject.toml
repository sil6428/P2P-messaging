[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "affan-secure-messaging"
version = "0.1.0"
description = "Work-in-progress security-focused messaging platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Affan Muhammad Shaikh" }]
dependencies = [
  "cryptography>=45,<51",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
secure-messaging = "secure_messaging.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_messaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
